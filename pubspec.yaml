name: Koperasi
description: Aplikasi Sistem Informasi Keuangan Koperasi BMSS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  get_it: ^7.6.7
  
  # Database Local
  sqflite: ^2.3.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  sqflite_common_ffi: ^2.3.3
  # Security
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  bcrypt: ^1.1.3
  
  # Utility
  dartz: ^0.10.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  
  # PDF & Export
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Network (optional untuk sync ke MySQL nanti)
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true